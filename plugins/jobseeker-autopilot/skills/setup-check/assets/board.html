<title>Papan Lamaran</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Airport departures board: one dark panel, rows flip when a status changes. */
:root{
  --bg:#0b1016; --board:#121a24; --row:#16202b; --flap:#1f2a36; --line:#26313d;
  --ink:#f3f1e8; --dim:#8a96a3; --faint:#5d6875;
  --filling:#ffb547; --ready:#f0531c; --sent:#5fd39a; --interview:#7cc4ff; --error:#ff6b6b;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font:14px/1.45 var(--f-body);padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.board{background:var(--board);border-radius:6px;padding:18px 18px 10px;font-family:var(--f-mono);min-width:0}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.14em;color:var(--dim)}
.head b{color:var(--ink);font-size:14px;letter-spacing:.2em}
.now{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12.5px;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.now.running .dot{background:var(--filling);animation:blink 1.2s steps(2) infinite}
.now .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now .t{color:var(--dim);font-size:11px;flex:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:12px 0 8px}
.tabs button{font:500 11px var(--f-mono);letter-spacing:.1em;color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:2px;padding:6px 9px;cursor:pointer}
.tabs button b{color:var(--ink);font-weight:700;margin-left:6px}
.tabs button[aria-pressed="true"]{background:var(--flap);color:var(--ink);border-color:var(--flap)}
.tabs button:focus-visible{outline:2px solid var(--filling);outline-offset:2px}
.cols,.row{display:grid;grid-template-columns:58px minmax(0,1fr) 128px 52px 150px;gap:12px;align-items:center}
.cols{font-size:10.5px;letter-spacing:.12em;color:var(--dim);padding:8px 6px 6px}
.row{padding:9px 6px;border-top:1px solid var(--line);text-decoration:none;color:inherit;font-variant-numeric:tabular-nums}
a.row:hover{background:var(--row)}
a.row:focus-visible{outline:2px solid var(--filling);outline-offset:-2px}
.when{color:var(--dim);font-size:11.5px}
.job{min-width:0}
.role{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{font-size:11.5px;color:var(--ready);margin-top:2px;white-space:normal}
.row[data-s="skip"] .note,.row[data-s="rejected"] .note,.row[data-s="sent"] .note,.row[data-s="pending"] .note{color:var(--dim)}
.city span{display:inline-block;max-width:100%;background:var(--flap);padding:2px 6px;border-radius:2px;font-size:11.5px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.match{font-size:12.5px}
.st{font-weight:700;font-size:11px;letter-spacing:.08em;display:inline-block}
.st.queued{color:var(--ink)}.st.filling{color:var(--filling)}.st.ready{color:var(--ready)}.st.sent{color:var(--sent)}
.st.interview,.st.offer{color:var(--interview)}.st.pending{color:var(--filling)}.st.error{color:var(--error)}
.st.rejected,.st.skip{color:var(--dim)}
.st.flip{animation:flip .5s steps(4)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--dim);padding:10px 6px 2px;letter-spacing:.08em;border-top:1px solid var(--line)}
.empty{padding:28px 6px;color:var(--dim);font-size:12.5px;border-top:1px solid var(--line);line-height:1.6}
.empty code{color:var(--ink);background:var(--flap);padding:1px 5px;border-radius:2px}
.more{font:500 11px var(--f-mono);letter-spacing:.1em;color:var(--dim);background:transparent;border:0;padding:10px 6px;cursor:pointer;text-align:left}
.more:hover{color:var(--ink)}
@keyframes blink{50%{opacity:.25}}
@keyframes flip{0%{transform:scaleY(1)}25%{transform:scaleY(.1)}50%{transform:scaleY(1)}75%{transform:scaleY(.2)}100%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.now.running .dot,.st.flip{animation:none}}
@media (max-width:720px){
  .cols{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"job st" "meta meta";row-gap:6px}
  .job{grid-area:job}.stc{grid-area:st;text-align:right}
  .when,.city,.match{grid-area:meta}
  .row .meta{grid-area:meta;display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--dim)}
  .row>.when,.row>.city,.row>.match{display:none}
}
@media (min-width:721px){.row .meta{display:none}}
</style>

<div class="wrap">
  <section class="board" aria-label="Status lamaran">
    <div class="head"><b>DEPARTURES</b><span>JOBSEEKER AUTOPILOT · <span id="clock">--:--</span></span></div>
    <div class="now" id="now"><span class="dot"></span><span class="txt" id="now-txt">Menunggu data…</span><span class="t" id="now-t"></span></div>
    <div class="tabs" id="tabs" role="group" aria-label="Filter status"></div>
    <div class="cols" aria-hidden="true"><span>UPDATE</span><span>ROLE</span><span>KOTA</span><span>MATCH</span><span>STATUS</span></div>
    <div id="rows"></div>
    <div class="foot"><span id="foot-l">—</span><span id="foot-r"></span></div>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
const LABEL={queued:'ANTRE',filling:'DIISI',ready:'SIAP SUBMIT',pending:'MENUNGGU',sent:'TERKIRIM',interview:'INTERVIEW',offer:'OFFER',rejected:'DITOLAK',skip:'DILEWATI',error:'GAGAL'};
const RANK={ready:0,error:1,interview:2,offer:3,filling:4,queued:5,pending:6,sent:7,rejected:8,skip:9};
const TABS=[
  ['all','SEMUA',()=>true],
  ['act','PERLU AKSI',s=>['ready','error','interview','offer'].includes(s)],
  ['run','PROSES',s=>['queued','filling','pending'].includes(s)],
  ['sent','TERKIRIM',s=>s==='sent'],
  ['out','DILEWATI/DITOLAK',s=>s==='skip'||s==='rejected']
];
const PAGE=60;
let jobs=[],tab='all',shown=PAGE,prev=new Map(),flips=new Set(),run=null;
try{const t=localStorage.getItem('board-tab');if(TABS.some(x=>x[0]===t))tab=t}catch(e){}

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function when(iso){
  if(!iso)return'';const d=new Date(iso);if(isNaN(d))return'';
  const now=new Date();
  if(d.toDateString()===now.toDateString())return d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',hour12:false}).replace('.',':');
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'}).toUpperCase().replace('.','');
}
function tick(){$('clock').textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',hour12:false}).replace('.',':')}
tick();setInterval(tick,15000);

function renderTabs(){
  $('tabs').innerHTML=TABS.map(([k,l,f])=>`<button type="button" id="tab-${k}" data-k="${k}" aria-pressed="${k===tab}">${l}<b>${jobs.filter(j=>f(j.status)).length}</b></button>`).join('');
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.k;shown=PAGE;try{localStorage.setItem('board-tab',tab)}catch(e){}render()});

function row(j){
  const s=LABEL[j.status]?j.status:'queued';
  const m=typeof j.match==='number'?j.match+'%':'—';
  const tag=j.link&&/^https:\/\//.test(j.link)?'a':'div';
  const href=tag==='a'?` href="${esc(j.link)}" target="_blank" rel="noopener"`:'';
  return `<${tag} class="row" data-s="${s}"${href}>
    <span class="when">${esc(when(j.updated))}</span>
    <span class="job"><div class="role">${esc(j.role)}</div><div class="co">${esc(j.company)}${j.channel?' · '+esc(j.channel):''}</div>${j.note?`<div class="note">${esc(j.note)}</div>`:''}</span>
    <span class="city"><span>${esc((j.city||'').toUpperCase())||'—'}</span></span>
    <span class="match">${m}</span>
    <span class="stc"><span class="st ${s}${flips.has(j.id)?' flip':''}">${LABEL[s]}</span></span>
    <span class="meta"><span>${esc(when(j.updated))}</span><span>${esc((j.city||'').toUpperCase())}</span><span>${m}</span></span>
  </${tag}>`;
}

function render(){
  renderTabs();
  const f=TABS.find(t=>t[0]===tab)[2];
  const list=jobs.filter(j=>f(j.status)).sort((a,b)=>(RANK[a.status]??5)-(RANK[b.status]??5)||String(b.updated||'').localeCompare(String(a.updated||'')));
  if(!jobs.length){
    $('rows').innerHTML=`<div class="empty">Belum ada lamaran di papan ini.<br>Bilang ke Claude <code>find jobs</code>, lalu <code>apply to 1, 3 and 5</code>. Setiap lowongan muncul di sini dan statusnya berubah langsung: ANTRE → DIISI → SIAP SUBMIT → TERKIRIM.</div>`;
  }else if(!list.length){
    $('rows').innerHTML=`<div class="empty">Tidak ada lamaran dengan status ini.</div>`;
  }else{
    $('rows').innerHTML=list.slice(0,shown).map(row).join('')+(list.length>shown?`<button type="button" class="more" id="more">TAMPILKAN ${list.length-shown} LAGI</button>`:'');
    const m=$('more');if(m)m.onclick=()=>{shown+=PAGE;render()};
  }
  const sent=jobs.filter(j=>j.status==='sent'||j.status==='interview'||j.status==='offer'||j.status==='rejected').length;
  const scanned=run&&typeof run.scanned==='number'?run.scanned+' DIPINDAI · ':'';
  const passed=run&&typeof run.passed==='number'?run.passed+' LOLOS FILTER · ':'';
  $('foot-l').textContent=scanned+passed+sent+' TERKIRIM';
}

function renderRun(){
  const box=$('now');
  if(!run){$('now-txt').textContent='Belum ada aktivitas.';$('now-t').textContent='';box.classList.remove('running');return}
  box.classList.toggle('running',run.state==='running');
  $('now-txt').textContent=run.activity||(run.state==='running'?'Sedang berjalan…':'Selesai.');
  $('now-t').textContent=when(run.updated);
}

(async()=>{
  const db=await claude.use('db');
  if(!db){
    $('now-txt').textContent='Buka papan ini di claude.ai untuk melihat status live.';
    $('foot-r').textContent='OFFLINE';render();return;
  }
  $('foot-r').innerHTML='<span>● LIVE</span>';
  db.collection('jobs').limit(1000).onSnapshot(snap=>{
    flips=new Set();
    const next=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(prev.size)for(const j of next){const p=prev.get(j.id);if(p!==undefined&&p!==j.status)flips.add(j.id)}
    prev=new Map(next.map(j=>[j.id,j.status]));
    jobs=next;render();
  },e=>{$('foot-r').textContent='TERPUTUS · MUAT ULANG HALAMAN'});
  db.doc('run/now').onSnapshot(s=>{run=s.exists?s.data():null;renderRun();render()},()=>{});
})();
render();
</script>
